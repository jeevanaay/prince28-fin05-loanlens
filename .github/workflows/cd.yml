
name: LoanLens CD

on:
  workflow_run:
    workflows: ["LoanLens CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy-and-smoke-test:
    name: Migrate, deploy and smoke test

    if: >-
      ${{
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install project dependencies
        run: uv sync --frozen

      - name: Run production database migrations
        env:
          APP_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail

          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is missing."
            exit 1
          fi

          echo "Applying production database migrations..."
          uv run alembic upgrade head
          echo "Production migrations completed."

      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          set -euo pipefail

          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK secret is missing."
            exit 1
          fi

          echo "Triggering Render deployment..."

          curl --fail --silent --show-error \
            --request POST \
            "$RENDER_DEPLOY_HOOK"

          echo "Render deployment request submitted."

      - name: Wait for production deployment and verify commit
        env:
          EXPECTED_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          echo "Expected production commit: $EXPECTED_COMMIT"

          DEPLOYED_COMMIT=""

          for attempt in $(seq 1 60); do
            if curl -fsS \
              https://prince28-fin05-loanlens.onrender.com/health \
              -o /tmp/health.json; then

              DEPLOYED_COMMIT=$(python -c "
          import json
          data = json.load(open('/tmp/health.json'))
          print(data.get('commit', ''))
          ")

              echo "Currently deployed: ${DEPLOYED_COMMIT:-commit unavailable}"

              if [ "$DEPLOYED_COMMIT" = "$EXPECTED_COMMIT" ]; then
                echo "Expected commit is now live."
                break
              fi
            fi

            echo "Attempt $attempt/60: Waiting for deployment..."
            sleep 10
          done

          if [ "$DEPLOYED_COMMIT" != "$EXPECTED_COMMIT" ]; then
            echo "Smoke test failed: expected commit was not deployed."
            exit 1
          fi

      - name: Verify production database readiness
        run: |
          set -euo pipefail

          echo "Checking database readiness..."

          for attempt in $(seq 1 12); do
            if curl -fsS \
              https://prince28-fin05-loanlens.onrender.com/ready \
              -o /tmp/ready.json; then

              if python -c "
          import json
          import sys

          with open('/tmp/ready.json') as file:
              data = json.load(file)

          ready = (
              data.get('status') == 'ready'
              and data.get('checks', {}).get('database') is True
          )

          sys.exit(0 if ready else 1)
          "; then
                echo "Production smoke tests passed."
                exit 0
              fi
            fi

            echo "Readiness attempt $attempt/12 failed. Retrying..."
            sleep 10
          done

          echo "Smoke test failed: database is not ready."
          exit 1
